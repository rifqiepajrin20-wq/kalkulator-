<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Sederhana</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
  }
  .calculator {
    background: #1c1c1e;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    width: 320px;
  }
  .display {
    background: #000;
    color: #fff;
    font-size: 2.5rem;
    text-align: right;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
    overflow-x: auto;
    min-height: 80px;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    padding: 20px;
    font-size: 1.2rem;
    border: none;
    border-radius: 12px;
    background: #333;
    color: #fff;
    cursor: pointer;
    transition: 0.15s;
  }
  button:hover { background: #444; }
  button:active { transform: scale(0.95); }
  .operator { background: #ff9500; }
  .operator:hover { background: #ffad33; }
  .equal { background: #34c759; grid-column: span 2; }
  .equal:hover { background: #4cd964; }
  .clear { background: #ff3b30; }
  .clear:hover { background: #ff6259; }
</style>
</head>
<body>
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">⌫</button>
      <button class="operator" onclick="appendValue('/')">÷</button>
      <button class="operator" onclick="appendValue('*')">×</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('-')">−</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="equal" onclick="calculate()">=</button>

      <button onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>
    </div>
  </div>

<script>
  const display = document.getElementById('display');
  let current = '';

  function appendValue(val) {
    if (display.innerText === '0' && !isNaN(val)) current = '';
    current += val;
    display.innerText = current;
  }

  function clearDisplay() {
    current = '';
    display.innerText = '0';
  }

  function deleteLast() {
    current = current.slice(0, -1);
    display.innerText = current || '0';
  }

  function calculate() {
    try {
      const result = eval(current);
      display.innerText = result;
      current = result.toString();
    } catch {
      display.innerText = 'Error';
      current = '';
    }
  }

  // Dukungan keyboard
  document.addEventListener('keydown', (e) => {
    if (!isNaN(e.key) || ['+','-','*','/','.'].includes(e.key)) appendValue(e.key);
    else if (e.key === 'Enter') calculate();
    else if (e.key === 'Backspace') deleteLast();
    else if (e.key.toLowerCase() === 'c') clearDisplay();
  });
</script>
</body>
</html>
